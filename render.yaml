services:
  - type: web
    name: finance-housekeeper-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
      # 数据库连接串含密码，不写进仓库；由用户在 Render 控制台填写
      - key: MONGODB_URI
        sync: false