services:
  - type: web
    name: finance-housekeeper-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://finance-housekeeper.vercel.app"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
